[package]
name = "fixwire"
version = "0.1.1"
description = "Fixwire SDK for Rust: errors, panics, traces, release health, cron monitors and feedback"
keywords = ["fixwire", "errors", "panic", "tracing", "monitoring"]
categories = ["development-tools::debugging"]
readme = "README.md"
homepage = "https://fixwire.io"
documentation = "https://docs.rs/fixwire"
include = ["src/**/*.rs", "README.md", "LICENSE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["matched-path"], optional = true }
backtrace = "0.3.76"
flate2 = "1.1.10"
getrandom = "0.4.3"
http = { version = "1.5.0", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tower = { version = "0.5.3", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }
ureq = "3.4.2"

[features]
default = []
# A tower layer for HTTP servers (axum, hyper, tonic): a scope, a server span and a session per request.
tower = ["dep:tower", "dep:http", "dep:pin-project-lite"]
# axum's matched route (/orders/{id}) as the request's name.
axum = ["tower", "dep:axum"]
# A tracing layer: events as breadcrumbs, error events as Fixwire events.
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[[test]]
name = "tower"
required-features = ["axum"]

[[test]]
name = "tracing_layer"
required-features = ["tracing"]

[lints.rust]
unsafe_code = "forbid"
